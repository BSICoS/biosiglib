site_name: Biosiglib
site_description: Language-independent specifications and conformance resources for reproducible biomedical signal processing.
repo_url: https://github.com/BSICoS/biosiglib
repo_name: BSICoS/biosiglib

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search

nav:
  - Home: index.md
  - Ecosystem: ecosystem.md
  - Specifications:
      - Overview: specifications.md
      # BEGIN GENERATED SPECIFICATION NAVIGATION
      - ecg.baselineremove: generated/specifications/ecg.baselineremove.md
      - ecg.pantompkins: generated/specifications/ecg.pantompkins.md
      - ecg.sloperange: generated/specifications/ecg.sloperange.md
      - hrv.fdmetrics: generated/specifications/hrv.fdmetrics.md
      - hrv.fillgaps: generated/specifications/hrv.fillgaps.md
      - hrv.ipfm: generated/specifications/hrv.ipfm.md
      - hrv.osp: generated/specifications/hrv.osp.md
      - hrv.removefp: generated/specifications/hrv.removefp.md
      - hrv.tdmetrics: generated/specifications/hrv.tdmetrics.md
      - tools.lpd_filter: generated/specifications/tools.lpd_filter.md
      - tools.medfilt_threshold: generated/specifications/tools.medfilt_threshold.md
      - tools.nan_filter: generated/specifications/tools.nan_filter.md
      - tools.nan_filtfilt: generated/specifications/tools.nan_filtfilt.md
      - tools.snap_to_peak: generated/specifications/tools.snap_to_peak.md
      # END GENERATED SPECIFICATION NAVIGATION
  - Scientific Notes:
      - Overview: scientific/index.md
      - ecg.baselineremove: scientific/ecg.baselineremove.md
      - ecg.sloperange: scientific/ecg.sloperange.md
      - hrv.fillgaps: scientific/hrv.fillgaps.md
      - hrv.ipfm: scientific/hrv.ipfm.md
      - hrv.fdmetrics: scientific/hrv.fdmetrics.md
      - hrv.osp: scientific/hrv.osp.md
      - hrv.removefp: scientific/hrv.removefp.md
      - Template: scientific/template.md
  - Conformance: conformance.md
  - Releases: releases.md
  - Citation: citation.md
  - Development: development.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
